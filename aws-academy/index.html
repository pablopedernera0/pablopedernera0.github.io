        html { background: #131a22; }

            color: #e8edf2;
            line-height: 1.65;
            min-height: 100vh;
            display: flow-root;
        }
        a { color: #ffb84d; }

        /* Pantalla de clave */
        #candado {
            max-width: 420px;
            width: calc(100% - 32px);
            margin: 18vh auto 0;
            padding: 2rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 153, 0, 0.35);
            border-radius: 12px;
            text-align: center;
        }
        #candado h1 { color: #ff9900; font-size: 1.5rem; margin-bottom: 0.4rem; }
        #candado p { color: #b8c4d0; font-size: 0.95rem; margin-bottom: 1.2rem; }
        #candado input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            border: 1px solid #4a5a6b;
            background: #0e141a;
            color: #e8edf2;
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }
        #candado button, #salir {
            background: #ff9900;
            color: #131a22;
            border: none;
            border-radius: 6px;
            padding: 0.6rem 1.4rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }
        #candado button:disabled { opacity: 0.6; cursor: wait; }
        #error { color: #ff6b6b; min-height: 1.4rem; margin-top: 0.6rem; font-size: 0.9rem; }

        /* Contenido */
        .layout {
            display: grid;

            gap: 2.5rem;
            max-width: 1250px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }
        nav.toc {
            position: sticky;
            top: 1.5rem;
            align-self: start;
            font-size: 0.9rem;
            border-left: 2px solid rgba(255, 153, 0, 0.35);
            padding-left: 1rem;
        }
        nav.toc .toc-title {
            color: #ff9900;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.8rem;
            margin-bottom: 0.6rem;
        }
        nav.toc a { display: block; color: #b8c4d0; text-decoration: none; padding: 0.2rem 0; }
        nav.toc a:hover { color: #ff9900; }
        main { min-width: 0; }
        .eyebrow {
            display: inline-block;

            border: 1px solid #ff9900;
            color: #ff9900;

        }
        .info-vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.8rem; align-items: stretch; }
        .info-card {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            border-top: 4px solid var(--c);
            padding: 1rem 1.1rem;

        .info-card .cabeza { display: flex; align-items: center; gap: 0.7rem; color: var(--c); margin-bottom: 0.8rem; }
        .info-card .cabeza strong { font-size: 1.15rem; line-height: 1.2; display: block; }
        .info-card .cabeza span { font-size: 0.85rem; color: #b8c4d0; }

        .info-card dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c); margin-top: 0.7rem; }
        .info-card dd { margin: 0.1rem 0 0; font-size: 0.95rem; }
        .info-mas {

            width: 2.6rem; height: 2.6rem;
            border-radius: 50%;

            background: #232f3e;
            border: 1px solid #4a5a6b;
            font-size: 1.4rem; font-weight: 600; color: #e8edf2;

        .info-pie {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem 0.8rem;
            margin-top: 1rem; padding: 0.7rem 1rem;

        .info-camino li { position: relative; margin: 0; text-align: center; color: var(--c); }
        .info-camino li:not(:last-child)::after {

        .info-camino .circulo {

            border-radius: 50%;

            border: 2px solid var(--c);

        @media (max-width: 640px) {
            .info { padding: 1rem; }

            .info-camino { grid-template-columns: 1fr; gap: 0; }
            .info-camino li {

        }

    const GUARDADA = 'aws-academy-clave';

    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const ab64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

    async function derivar(clave) {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: b64(CIFRADO.salt), iterations: CIFRADO.iter, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }

    async function abrir(llave) {
        const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(CIFRADO.iv) }, llave, b64(CIFRADO.data));
        const cont = document.getElementById('contenido');
        cont.innerHTML = new TextDecoder().decode(plano);
        document.getElementById('candado').hidden = true;
        cont.hidden = false;
        document.getElementById('salir').hidden = false;
        if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    }

    // Se pide una vez por dispositivo: se guarda la llave derivada (no la clave), atada a la
    // sal del cifrado; si se vuelve a cifrar con otra clave, se pide de nuevo.
    (async () => {
        try {
            const g = JSON.parse(localStorage.getItem(GUARDADA) || 'null');
            if (g && g.salt === CIFRADO.salt) {
                const llave = await crypto.subtle.importKey('raw', b64(g.llave), 'AES-GCM', false, ['decrypt']);
                await abrir(llave);
            }
        } catch (e) { try { localStorage.removeItem(GUARDADA); } catch (_) {} }
    })();

    document.getElementById('candado').addEventListener('submit', async ev => {
        ev.preventDefault();
        const boton = document.getElementById('entrar');
        const error = document.getElementById('error');
        boton.disabled = true;
        error.textContent = '';
        try {
            const llave = await derivar(document.getElementById('clave').value);
            await abrir(llave);
            try {
                localStorage.setItem(GUARDADA, JSON.stringify({ salt: CIFRADO.salt, llave: ab64(await crypto.subtle.exportKey('raw', llave)) }));
            } catch (_) {}
        } catch (e) {
            error.textContent = 'Clave incorrecta.';
        } finally {
            boton.disabled = false;
        }
    });

    document.getElementById('salir').addEventListener('click', () => {
        try { localStorage.removeItem(GUARDADA); } catch (_) {}
        location.reload();
    });
    </script>
